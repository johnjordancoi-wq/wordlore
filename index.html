
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11182d" />
    <title>WordLore | A Filipino Folklore Adventure</title>
  </head>
  <body>
    <div id="game-container"></div>
    <button
      id="fullscreen-button"
      type="button"
      aria-label="Enter fullscreen"
      title="Enter fullscreen"
      hidden
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
      </svg>
    </button>
    <span id="fullscreen-status" class="visually-hidden" aria-live="polite"></span>
    <div id="orientation-prompt" role="status" aria-live="polite">
      <span class="orientation-prompt__device" aria-hidden="true"></span>
      <h1>Rotate your device</h1>
      <p>Turn your phone or tablet sideways to play.</p>
      <p lang="fil">Itili nang pahiga ang iyong telepono o tablet para maglaro.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
