<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body, #game-container { margin: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module">
      import Phaser from "phaser";
      import { GAME_HEIGHT, GAME_WIDTH, COLORS } from "./src/config/gameConfig.js";
      import { ChapterThreeScene } from "./src/scenes/ChapterThreeScene.js";
      import { Storybook } from "./src/scenes/MenuScenes.js";

      class ChapterThreeBookCheck extends Storybook {
        create() {
          super.create({ chapter: 3 });
        }
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: "game-container",
        backgroundColor: `#${COLORS.background.toString(16)}`,
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH,
          width: GAME_WIDTH,
          height: GAME_HEIGHT,
        },
        render: { antialias: true, roundPixels: true, pixelArt: false },
        scene: [ChapterThreeBookCheck, ChapterThreeScene],
      });
    </script>
  </body>
</html>
